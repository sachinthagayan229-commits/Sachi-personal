name: Sachi Personal Bot

on:
  workflow_dispatch:
    inputs:
      pair_number:
        description: 'First time only (pairing code mode): WhatsApp number like 94771234567, no plus sign'
        required: false
        default: ''
      use_qr:
        description: 'Login with QR code (QR will be printed in the logs)'
        type: boolean
        default: false
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: sachi-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install
          npm install qrcode --no-save

      - name: Restore session cache
        uses: actions/cache/restore@v4
        with:
          path: session
          key: session-${{ github.run_id }}
          restore-keys: session-

      - name: Run bot
        env:
          PAIR_NUMBER: ${{ github.event.inputs.pair_number }}
          QR_LOGIN: ${{ github.event.inputs.use_qr }}
          SESSION_ID: ${{ secrets.SESSION_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          code=0
          timeout 295m node index.js || code=$?
          if [ $code -ne 124 ]; then exit $code; fi

      - name: Save session cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: session
          key: session-${{ github.run_id }}
