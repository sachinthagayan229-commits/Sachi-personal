name: Sachi Personal Bot

on:
  workflow_dispatch:
    inputs:
      pair_number:
        description: 'පළවෙනි වතාවට විතරයි: WhatsApp number (94771234567 වගේ, + නැතිව)'
        required: false
        default: ''
      use_qr:
        description: 'QR code එකෙන් login වෙන්න (pair_number දුන්නා නම් මේක ටික් කරන්න එපා)'
        type: boolean
        default: false
  schedule:
    - cron: '0 */6 * * *'   # පැය 6කට සැරයක් auto restart

# එකවර instance දෙකක් run වෙන්න දෙන්නෙ නෑ (session conflict වෙනවා)
concurrency:
  group: sachi-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Restore session cache
        uses: actions/cache/restore@v4
        with:
          path: session
          key: session-${{ github.run_id }}
          restore-keys: session-

      - name: Run bot
        env:
          PAIR_NUMBER: ${{ github.event.inputs.pair_number }}
          QR_LOGIN: ${{ github.event.inputs.use_qr }}
          SESSION_ID: ${{ secrets.SESSION_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          timeout 345m node index.js
          code=$?
          if [ $code -ne 124 ]; then exit $code; fi

      - name: Save session cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: session
          key: session-${{ github.run_id }}
